[package]
name = "webrtc-poc-shared"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "shared"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_bytes = "0.11"
bincode = "1.3"
ed25519-dalek = { version = "2", default-features = false, features = ["alloc", "zeroize"] }

[dev-dependencies]
rand = "0.8"
ed25519-dalek = { version = "2", default-features = false, features = ["alloc", "zeroize", "rand_core"] }
